<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <title>BS-Modal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <body>
        <div class="container mt-5">
            <h2 class="text-center">Bootstrap Modal Example</h2>
            <p class="fs-5">
                A modal is a popup dialogue box used to show info or collect user inputs without leaving the page.
            </p>

            <!--Button opens the modal. myModal acts as the id-->
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
            Open Modal
            </button>

            <!--modal creates the modal. fade adds animation. tabindex=-1 prevents tab from accessing model before its opened-->
            <div class="modal fade" id="myModal" tabindex="-1">
                <div class="modal-dialog"> <!--Creates the popup box, the frame of the modal-->
                    <div class="modal-content">
                        
                        <div class="modal-header"> <!--Modal Header-->
                            <hs class="modal-title">Modal Title</hs> <!--Title-->
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button> <!--Close Button-->
                        </div>

                        <div class="modal-body"> <!--Modal Body-->
                            Bootstrap modal plugin example
                        </div>

                        <div class="modal-footer"> <!--Modal Footer usually where the end butons are-->
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button> <!--Close Button-->
                            <button type="button" class="btn btn-success">Save</button> <!--Save Button-->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
