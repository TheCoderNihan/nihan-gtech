<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>BS Icons</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="container">
            <h3 class="text-center text-danger">
            Glyphicons are icon fonts used with text or buttons. Available only in BS 3, not supported in BS 4 & 5.
            Now we use Bootstrap icons or fontawesome icons by linking their cdn css files.
            </h3>

            <p class="fs-5 text-center text-primary">FontAwesome Icons</p>
            <i class="fa-solid fa-house"> House</i> <br>
            <i class="fa-solid fa-user"> User</i> <br>
            <button class="btn btn-primary">
                <i class="fa-solid fa-download"> Download</i>
            </button>

            <p class="fs-5 text-primary text-center">Bootstrap Icons</p>
            <i class="bi bi-house-fill"></i> Home <br><br>
            <i class="bi bi-heart-fill"> Heart</i> <br><br>
            <i class="bi bi-alarm"> Time</i> <br><br>
         </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
