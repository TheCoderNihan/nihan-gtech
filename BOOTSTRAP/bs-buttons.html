<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>BS Buttons</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container mt-4">
            <h2 class="text-center">Bootstrap Buttons</h2>
            <!--Normal Buttons-->
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-danger">Danger</button>
            <button class="btn btn-success">Success</button>
            <button class="btn btn-warning">Warning</button>
            <button class="btn btn-info">Info</button> <br><br>

            <h2 class="text-center">Outline buttons</h2>
            <p class="fs-5">
                Outline button has colored border and text with a transparent background.It becomes solid-colored when user hovers over it.
            </p>
            <button class="btn btn-outline-primary">Outline Primary</button>
            <button class="btn btn-outline-success">Outline Success</button> <br><br>

            <h2 class="text-center">Button Sizes</h2>
            <button class="btn btn-primary btn-lg">Large Button</button>
            <button class="btn btn-primary btn-sm">Small Button</button>

            <h2 class="text-center">Disabled Button</h2>
            <p class="fs-5">This prevents the button from being clicked.</p>
            <button class="btn btn-secondary" disabled>Disabled Button</button>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
